name: Deploy

# Flow: open a PR into `dev` -> ci.yml runs the tests. Merge the PR -> this
# workflow runs the full CI again as a gate, then deploys the API to Render and
# the web app to Vercel. Render and Vercel git auto-deploy are disabled (see
# render.yaml and apps/web/vercel.json) so this is the only path to deploy.
on:
  push:
    branches: [dev]
  workflow_dispatch: # manual re-deploy of the selected branch

concurrency:
  group: deploy-production
  cancel-in-progress: false # never abort a deploy mid-flight

permissions:
  contents: read

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  deploy-api:
    name: Deploy API → Render
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      # Either a deploy hook URL, or a Render API key + service id, works.
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering deploy via deploy hook"
            curl --fail --silent --show-error -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" > /dev/null
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "Triggering deploy via Render API"
            curl --fail --silent --show-error -X POST \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" -H "Content-Type: application/json" \
              -d "{\"commitId\":\"${GITHUB_SHA}\"}" > /dev/null
          else
            echo "::error::Set RENDER_DEPLOY_HOOK_URL, or both RENDER_API_KEY and RENDER_SERVICE_ID"
            exit 1
          fi

      # Waits for the NEW build, not just any healthy instance: Render keeps
      # serving the previous version until the new one passes its health check,
      # so a bare "is it healthy?" poll succeeds instantly against old code.
      # /health/ready reports the commit it is running (RENDER_GIT_COMMIT).
      - name: Wait for the new API version to be live
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }} # e.g. https://ti-api.onrender.com/health/ready
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "::warning::API_HEALTH_URL variable not set, skipping health wait"; exit 0
          fi
          last="(no response)"
          for i in $(seq 1 60); do
            body=$(curl --silent --max-time 15 "$API_HEALTH_URL" || true)
            last=$(echo "$body" | jq -r '.commit // "(no commit field)"' 2>/dev/null || echo "(unparseable)")
            if [ "$last" = "$GITHUB_SHA" ]; then
              echo "New version live after $i attempt(s): $last"; exit 0
            fi
            echo "Waiting for $GITHUB_SHA, API reports: $last ($i/60)"; sleep 10
          done
          echo "::error::API did not report commit $GITHUB_SHA within 10 minutes (last seen: $last)"; exit 1

  deploy-web:
    name: Deploy web → Vercel
    needs: [ci, deploy-api] # ship API first so the web never calls a missing endpoint
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@66.6.0

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
