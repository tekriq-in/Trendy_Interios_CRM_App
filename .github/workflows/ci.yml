name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main] # dev pushes are verified by deploy.yml, which calls this workflow
  workflow_call: # reused by deploy.yml so nothing ships unverified

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  verify:
    name: Type-check, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ti/shared build

      - name: Type-check (api, web, mobile)
        run: pnpm type-check

      - name: API unit tests
        run: pnpm --filter @ti/api test # Jest auto-enables CI mode via CI=true

      - name: Build API
        run: pnpm --filter @ti/api build

      - name: Build web
        run: pnpm --filter @ti/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_WS_URL: http://localhost:3001
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
            NEXT_PUBLIC_WS_URL=http://localhost:3001
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Informational until the known Next.js / multer / mongoose advisories are
      # upgraded. Step-level continue-on-error keeps the check green (the job
      # only goes red if the step itself cannot run) while still printing the
      # findings in the log and as a warning. Remove it to make this blocking.
      - name: pnpm audit (production deps, high and above)
        continue-on-error: true
        run: |
          if ! pnpm audit --prod --audit-level=high; then
            echo "::warning::Dependency audit found high/critical advisories. See log; upgrade tracked separately."
          fi
