# Self-hosted / local production-like stack. The cloud setup is Vercel (web) +
# Render (API) + Atlas (Mongo), see docs/DEPLOYMENT.md. Use this file to run
# the same images locally or on a single server.
#
# Required before `docker compose up`:
#   export MONGO_PASSWORD=<strong password>
#   and fill apps/api/.env (MONGODB_URI must use the same password)

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Not published to the host: only the api container can reach Mongo.
    # For ad-hoc access use `docker compose exec mongo mongosh`.
    expose:
      - '27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-tiroot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD to a strong password}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: apps/api/.env
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
    # The image already defines a HEALTHCHECK; readiness is what gates `web`.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the browser bundle at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production

volumes:
  mongo_data:
